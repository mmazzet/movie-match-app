server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Redirect HTTP to HTTPS (production)
    # Uncomment when using HTTPS:
    # return 301 https://$host$request_uri;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass ${BACKEND_URL};
    }

    # ========== SECURITY HEADERS ==========

    # Prevent clickjacking attacks
    # DENY: blocks your site from being embedded in ANY iframe
    # SAMEORIGIN: allows embedding only from same domain
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent MIME-type sniffing (attacker can't disguise malicious content)
    add_header X-Content-Type-Options "nosniff" always;

    # Enable browser XSS protection
    add_header X-XSS-Protection "1; mode=block" always;

    # Prevent referrer leaks to other sites
    # Only send referrer when navigating to same protocol/security level
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy - Strict XSS and injection prevention
    # - default-src 'self': only allow resources from your own domain
    # - script-src: only allow internal scripts (no inline)
    # - style-src: allow Tailwind CSS (unsafe-inline needed for dynamic Tailwind)
    # - img-src: allow images from same domain, HTTPS, data URIs (for movie posters)
    # - connect-src: only API calls to backend
    # - frame-src: only YouTube embeds
    # - object-src 'none': block plugins
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' ${BACKEND_URL}; frame-src https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # Enforce HTTPS in production (tells browsers to always use HTTPS for future visits)
    # Uncomment when using HTTPS - tells browsers to use HTTPS for 1 year
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Disable unused browser features for security
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}